name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Structural invariants
        run: node scripts/validate.mjs

      - name: Deterministic policy tests
        run: |
          node --test scripts/*.test.mjs plugins/review/skills/review-pr/*.test.mjs
          python3 -m unittest discover -s plugins/guardrails/tests -v
          python3 -m py_compile plugins/guardrails/hooks/*.py
          bash -n scripts/run-golden-task.sh

      - name: Version bumps (PRs only)
        if: github.event_name == 'pull_request'
        run: node scripts/validate.mjs --require-bumps "origin/${{ github.base_ref }}"
