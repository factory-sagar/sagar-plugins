name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Structural invariants
        run: node scripts/validate.mjs

      - name: Eval definition invariants
        run: |
          node scripts/validate-evals.mjs
          node --test scripts/eval-routing.test.mjs scripts/compare-baseline.test.mjs scripts/judge-contract.test.mjs scripts/validate-evals.test.mjs scripts/validate.test.mjs scripts/mine-fix-pairs.test.mjs scripts/run-review-fixpairs.test.mjs scripts/score-fixpairs.test.mjs scripts/model-decision.test.mjs

      - name: Deterministic policy tests
        run: |
          python3 -m unittest discover -s plugins/guardrails/tests -v
          python3 -m py_compile plugins/guardrails/hooks/*.py

      - name: Hook coverage floor
        run: |
          python3 -m pip install --quiet coverage || python3 -m pip install --user --quiet coverage --break-system-packages
          python3 -m coverage run --source=plugins/guardrails/hooks -m unittest discover -s plugins/guardrails/tests
          python3 -m coverage report --fail-under=87

      - name: PR comparability gates
        if: github.event_name == 'pull_request'
        run: |
          node scripts/validate.mjs --require-bumps "origin/${{ github.base_ref }}"
          node scripts/validate-evals.mjs --require-bumps "origin/${{ github.base_ref }}"
          node scripts/validate-evals.mjs --require-fresh-baselines "origin/${{ github.base_ref }}"
