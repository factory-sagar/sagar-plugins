name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Structural invariants
        run: node scripts/validate.mjs

      - name: Version bumps (PRs only)
        if: github.event_name == 'pull_request'
        run: node scripts/validate.mjs --require-bumps "origin/${{ github.base_ref }}"
